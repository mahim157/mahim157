
               - name: Generate Contribution Graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p profile

          python3 - <<'PY'
          import os
          import requests
          from datetime import datetime

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {"login": username}
              },
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json"
              }
          )

          response.raise_for_status()
          data = response.json()

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          weeks = calendar["weeks"]
          max_count = max(
              (day["contributionCount"] for week in weeks for day in week["contributionDays"]),
              default=1
          )

          cell_size = 12
          gap = 4
          left = 45
          top = 42

          width = left + len(weeks) * (cell_size + gap) + 15
          height = 125

          svg = []

          svg.append(f'''
          <svg xmlns="http://www.w3.org/2000/svg"
               width="{width}"
               height="{height}"
               viewBox="0 0 {width} {height}">

          <style>
            text {{
              font-family: Arial, sans-serif;
              fill: #8b949e;
              font-size: 10px;
            }}

            .title {{
              fill: #c9d1d9;
              font-size: 13px;
              font-weight: bold;
            }}

            rect {{
              stroke: none;
            }}
          </style>

          <text x="5" y="17" class="title">
            GitHub Contributions: {calendar["totalContributions"]}
          </text>
          ''')

          # Month labels with proper spacing
          last_month = None

          for i, week in enumerate(weeks):

              first_date = week["contributionDays"][0]["date"]

              date_obj = datetime.strptime(
                  first_date,
                  "%Y-%m-%d"
              )

              month = date_obj.strftime("%b")

              # Show month only when it changes
              if month != last_month:

                  x = left + i * (cell_size + gap)

                  svg.append(
                      f'<text x="{x}" y="34">{month}</text>'
                  )

                  last_month = month

          # Contribution cells
          for i, week in enumerate(weeks):

              for j, day in enumerate(week["contributionDays"]):

                  count = day["contributionCount"]

                  x = left + i * (cell_size + gap)
                  y = top + j * (cell_size + gap)

                  if count == 0:
                      opacity = 0.08
                  else:
                      opacity = 0.15 + (
                          0.55 * count / max_count
                      )

                  svg.append(
                      f'''
                      <rect
                        x="{x}"
                        y="{y}"
                        width="{cell_size}"
                        height="{cell_size}"
                        rx="3"
                        fill="#39d353"
                        opacity="{opacity:.2f}">
                        <title>
                          {day["date"]}: {count} contributions
                        </title>
                      </rect>
                      '''
                  )

          svg.append("</svg>")

          with open(
              "profile/contributions.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(svg))

          print("Contribution graph generated successfully.")
          PY
