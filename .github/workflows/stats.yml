 
                  name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p profile

          python3 - <<'PY'
          import os
          import requests
          from datetime import datetime, timedelta

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {"login": username}
              },
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json"
              }
          )

          response.raise_for_status()
          data = response.json()

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          days = []
          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          max_count = max((d["contributionCount"] for d in days), default=1)

          cell_size = 12
          gap = 3
          left = 45
          top = 25

          width = left + (len(calendar["weeks"]) * (cell_size + gap)) + 10
          height = 125

          months = []
          last_month = None

          for i, week in enumerate(calendar["weeks"]):
              first_day = week["contributionDays"][0]["date"]
              month = datetime.strptime(first_day, "%Y-%m-%d").strftime("%b")

              if month != last_month:
                  months.append((i, month))
                  last_month = month

          svg = []

          svg.append(f'''<svg xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}">
          ''')

          svg.append('''
          <style>
            text {
              font-family: Arial, sans-serif;
              fill: #8b949e;
              font-size: 10px;
            }
            .title {
              fill: #c9d1d9;
              font-size: 13px;
              font-weight: bold;
            }
          </style>
          ''')

          svg.append(
              f'<text x="5" y="15" class="title">'
              f'GitHub Contributions: {calendar["totalContributions"]}</text>'
          )

          for index, month in months:
              x = left + index * (cell_size + gap)
              svg.append(f'<text x="{x}" y="38">{month}</text>')

          for i, week in enumerate(calendar["weeks"]):
              for j, day in enumerate(week["contributionDays"]):
                  count = day["contributionCount"]

                  x = left + i * (cell_size + gap)
                  y = top + j * (cell_size + gap)

                  if count == 0:
                      opacity = 0.12
                  else:
                      opacity = 0.25 + 0.75 * (count / max_count)

                  svg.append(
                      f'<rect x="{x}" y="{y}" '
                      f'width="{cell_size}" height="{cell_size}" '
                      f'rx="2" fill="#39d353" opacity="{opacity:.2f}">'
                      f'<title>{day["date"]}: {count} contributions</title>'
                      f'</rect>'
                  )

          svg.append("</svg>")

          with open("profile/contributions.svg", "w", encoding="utf-8") as f:
              f.write("\n".join(svg))

          print("Contribution graph generated successfully.")
          PY

      - name: Commit Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub profile stats" || exit 0

          git push
